<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dərs Cədvəli</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pg:#f4f5f7;--tx:#14151a;--bar:#fff;--bd:#dfe1e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#121316;--tx:#eceef2;--bar:#1c1d22;--bd:#2d2f36}}
:root[data-theme="dark"]{--pg:#121316;--tx:#eceef2;--bar:#1c1d22;--bd:#2d2f36}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--pg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--bar);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.bar b{margin-right:auto;font-size:15px}
.bar button,.bar select,.bar label{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--bd);background:var(--bar);color:var(--tx);border-radius:8px;cursor:pointer}
.bar button.p{background:#2b4bff;color:#fff;border-color:#2b4bff}
.bar input[type=color]{width:26px;height:20px;border:0;padding:0;background:none;vertical-align:middle;margin-left:6px}
.hint{font-size:12.5px;opacity:.65;padding:10px 16px 0}
.wrap{overflow-x:auto;padding:16px}
#sheet{--bg:#2b4bff;--fg:#fff;--cell:#fff;--cellink:#14151a;--chip:#ffe933;--chipink:#2a1bd6;--muted:rgba(255,255,255,.7);
width:1180px;margin:0 auto;padding:44px 44px 36px;background:var(--bg);color:var(--fg);border-radius:6px}
#sheet[data-theme=light]{--bg:#fff;--fg:#14151a;--cell:#f3f4f7;--cellink:#14151a;--chip:#14151a;--chipink:#fff;--muted:#6b6f7a;outline:1px solid #e3e5ea}
#sheet[data-theme=dark]{--bg:#16171c;--cell:#23252c;--cellink:#f1f2f5;--chip:#ffe933;--chipink:#14151a}
.head{margin-bottom:26px}
#sheet [contenteditable]{outline:none;border-radius:6px}
#sheet [contenteditable]:hover{background:rgba(127,127,127,.15)}
#sheet [contenteditable]:focus{background:rgba(127,127,127,.22);box-shadow:0 0 0 2px rgba(127,127,127,.5)}
[contenteditable]:empty:before{content:attr(data-ph);opacity:.4}
.exporting [contenteditable]:empty:before{content:""}
.exporting [contenteditable]{background:none!important;box-shadow:none!important}
.exporting .lv:empty{display:none}
h1{margin:0;font-size:34px;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--muted);font-size:16px;margin-top:4px;display:inline-block;min-width:120px}
#grid{display:grid;grid-template-columns:78px repeat(6,1fr);gap:8px}
.dh{text-align:center;padding:6px 0}
.dn{font-weight:650;font-size:16px;display:block}
.dd{font-size:13px;color:var(--muted);display:block;min-width:50px;margin:2px auto 0}
.tm{display:flex;align-items:center;font-weight:650;font-size:15px}
.tm span{min-width:50px;padding:2px 4px}
.c{background:var(--cell);color:var(--cellink);border-radius:12px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 6px}
.lv{font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--chipink);min-width:36px;text-align:center}
.lv[data-k=A]{background:#ffe933;color:#3a2f00}.lv[data-k=B]{background:#6ee7b7;color:#053b2a}.lv[data-k=C]{background:#c4b5fd;color:#2b1670}
.tn{font-size:16px;font-weight:550;min-width:50px;text-align:center}
.foot{margin-top:18px;font-size:13px;color:var(--muted);min-height:20px;display:inline-block;min-width:200px}
</style>
</head>
<body>
<div class="bar">
<b>Dərs cədvəli</b>
<select id="theme"><option value="blue">Mavi</option><option value="light">Ağ</option><option value="dark">Tünd</option></select>
<label>Fon <input type="color" id="col" value="#2b4bff"></label>
<button id="addR">+ Saat</button><button id="delR">− Saat</button>
<button id="reset">Sıfırla</button>
<button id="png" class="p">PNG yüklə</button><button id="pdf" class="p">PDF yüklə</button>
</div>
<div class="hint">İstənilən yazıya klik edib dəyişin (başlıq, tarix, saat, səviyyə, müəllim). Dəyişikliklər brauzerdə avtomatik saxlanır.</div>
<div class="wrap"><div id="sheet" data-theme="blue">
<div class="head"><h1 contenteditable data-ph="Başlıq">Həftəlik Dərs Cədvəli</h1><span class="sub" contenteditable data-ph="Tarix aralığı">26.10 – 31.10.2026</span></div>
<div id="grid"></div>
<div class="foot" contenteditable data-ph="Qeyd (istəyə bağlı)"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const days=[["Bazar ertəsi","26.10"],["Çərşənbə axşamı","27.10"],["Çərşənbə","28.10"],["Cümə axşamı","29.10"],["Cümə","30.10"],["Şənbə","31.10"]];
const A="A1/A2",B="B1/B2",M="Mustafa";
const times=["11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"];
const data={"0,1":[A,M],"0,2":[B,M],"0,3":[A,M],"0,4":[B,M],"1,1":[B,M],"1,2":[A,M],"1,3":[B,M],"1,4":[A,M],"2,1":[A,M],"2,2":[B,M],"2,3":[A,M],"2,4":[A,M],"3,1":[B,M],"3,2":[A,M],"3,3":[B,M],"3,4":[B,M],"3,7":[A,"Aydın"],"4,0":[A,""],"4,1":[B,M],"4,2":[B,M],"4,3":[A,M],"4,4":[B,M],"5,3":[B,"Aydın"],"5,6":[A,"Fərid"]};
const g=document.getElementById("grid"),sh=document.getElementById("sheet"),KEY="cedvel-v1";
const ce=(c,t,p)=>`<div class="${c}" contenteditable data-ph="${p}">${t||""}</div>`;
function cell(d,r){const v=data[d+","+r]||["",""];return `<div class="c">${ce("lv",v[0],"Səviyyə")}${ce("tn",v[1],"Müəllim")}</div>`}
function build(){let h="<div></div>";
days.forEach(d=>h+=`<div class="dh"><span class="dn" contenteditable>${d[0]}</span><span class="dd" contenteditable data-ph="Tarix">${d[1]}</span></div>`);
times.forEach((t,r)=>{h+=`<div class="tm"><span contenteditable>${t}</span></div>`;for(let d=0;d<6;d++)h+=cell(d,r)});
g.innerHTML=h;tag()}
function addRow(){const last=g.querySelectorAll(".tm span");let t="";const m=last.length&&last[last.length-1].textContent.match(/^(\d+):(\d+)/);if(m)t=((+m[1]+1)%24+"").padStart(2,"0")+":"+m[2];
g.insertAdjacentHTML("beforeend",`<div class="tm"><span contenteditable>${t}</span></div>`+[0,1,2,3,4,5].map(()=>`<div class="c">${ce("lv","","Səviyyə")}${ce("tn","","Müəllim")}</div>`).join(""));save()}
function delRow(){for(let i=0;i<7;i++)if(g.children.length>7)g.lastElementChild.remove();save()}
function tag(){g.querySelectorAll(".lv").forEach(e=>{e.dataset.k=(e.textContent.trim()[0]||"").toUpperCase()})}
function save(){tag();try{localStorage.setItem(KEY,JSON.stringify({h:sh.innerHTML,t:sh.dataset.theme,c:sh.style.getPropertyValue("--bg")}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.h){sh.innerHTML=s.h;sh.dataset.theme=s.t||"blue";if(s.c)sh.style.setProperty("--bg",s.c);document.getElementById("theme").value=sh.dataset.theme;return true}}catch(e){}return false}
document.addEventListener("input",e=>{if(e.target.closest("#sheet"))save()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});
document.addEventListener("paste",e=>{if(e.target.isContentEditable){e.preventDefault();document.execCommand("insertText",false,(e.clipboardData.getData("text/plain")||"").replace(/\s+/g," "))}});
document.getElementById("addR").onclick=addRow;document.getElementById("delR").onclick=delRow;
document.getElementById("reset").onclick=()=>{if(confirm("Bütün dəyişikliklər silinsin?")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
document.getElementById("theme").onchange=e=>{sh.dataset.theme=e.target.value;sh.style.removeProperty("--bg");save()};
document.getElementById("col").oninput=e=>{sh.style.setProperty("--bg",e.target.value);save()};
async function snap(){sh.classList.add("exporting");try{return await html2canvas(sh,{scale:2,backgroundColor:null,useCORS:true})}finally{sh.classList.remove("exporting")}}
function dl(url,name){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.getElementById("png").onclick=async()=>{const c=await snap();dl(c.toDataURL("image/png"),"cedvel.png")};
document.getElementById("pdf").onclick=async()=>{const c=await snap();const {jsPDF}=window.jspdf;const w=c.width,h=c.height;
const p=new jsPDF({orientation:w>=h?"l":"p",unit:"px",format:[w/2,h/2]});p.addImage(c.toDataURL("image/png"),"PNG",0,0,w/2,h/2);p.save("cedvel.pdf")};
if(!load())build();else tag();
</script>
</body>
</html>
